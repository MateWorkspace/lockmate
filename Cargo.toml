[package]
name = "lockmate"
version = "0.1.0-dev.1"
edition = "2024"

[dependencies]
axum = "0.8.9"
bcrypt = "0.19"
dotenvy = "0.15"
getrandom = { version = "0.4", features = ["std"] }
hex = "0.4"
humantime = "2"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
mate-pgdt = { path = "../mate-rust/crates/mate-pgdt", features = ["json", "time", "uuid"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "serde-well-known"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = "1"
