securityDefinitions:
  BearerAuth:
    description: Bearer followed by a space-scoped access token.
    in: header
    name: Authorization
    type: apiKey
  ClientExecId:
    description: Nonzero UUID used for execution tracing, not authentication.
    in: header
    name: X-Client-Exec-Id
    type: apiKey
  ClientSecret:
    description: Client secret supplied by the consuming application.
    in: header
    name: X-Client-Secret
    type: apiKey
  ClientSlug:
    description: Registered client slug.
    in: header
    name: X-Client-Slug
    type: apiKey
swagger: "2.0"
tags:
- description: Service information.
  name: 00. Version
- description: Classic registration, sign-in, refresh, Google sign-in/registration,
    and single-use authentication handoff.
  name: 01. Auth
- description: The authenticated user's own profile and credentials.
  name: 02. Profile
- description: Space administration.
  name: 03. Spaces
- description: Permission administration.
  name: 04. Permissions
- description: Role administration.
  name: 05. Roles
- description: User administration.
  name: 06. Users
- description: ClassicAuth administration.
  name: 07. Classic Auth
- description: GoogleAuth administration.
  name: 08. Google Auth
- description: Client administration.
  name: 09. Clients
- description: Client origin allowlist administration.
  name: 10. Client Origins
- description: SpaceMember administration.
  name: 11. Space Members
- description: RolePermission administration.
  name: 12. Role Permissions
- description: SpaceMemberRole administration.
  name: 13. Space Member Roles
